# dsh-intent-view bundle patch
#
# 装配层：把这个包插进包含它的 profile 的 bundle 列表。
#
# 纯新增：一行 insert，id 不与任何已发行条目冲突。没有禁用、改名或重配任何
# 已发行条目，所以它可以和任何其他插件的 patch 共存。
#
# 这一行只是给 loader 一个宿主侧入口；本插件的**全部行为在浏览器半边**
# （见 src/client/index.ts）——宿主侧 apply 只输出一条加载日志。

- insert:
    - id: dsh-intent-view
      name: dsh-intent-view
